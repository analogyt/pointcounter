<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>micro:bit Party Point Arena</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #131d31;
            --card-border: #1e293b;
            --accent: #38bdf8;
            --active-glow: rgba(16, 185, 129, 0.3);
            --active-border: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            color: var(--accent);
            font-size: 28px;
            margin-bottom: 5px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .btn:hover { background-color: #0369a1; transform: translateY(-1px); }
        .btn.connected { background-color: #10b981; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn.secondary { background-color: #334155; box-shadow: none; }
        .btn.secondary:hover { background-color: #475569; }

        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .player-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 14px;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            cursor: pointer;
        }

        .player-card.active {
            border-color: var(--active-border);
            box-shadow: 0 0 25px var(--active-glow);
            transform: scale(1.02);
        }

        .turn-badge {
            position: absolute;
            top: -10px;
            right: 20px;
            background: #10b981;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: none;
        }

        .player-card.active .turn-badge { display: block; }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .name-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 20px;
            font-weight: 700;
            width: 150px;
            outline: none;
            padding: 4px;
            border-radius: 4px;
        }
        .name-input:focus { background: rgba(255,255,255,0.05); }

        .score-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .score-value {
            font-size: 26px;
            font-weight: 800;
            color: var(--accent);
            min-width: 50px;
            text-align: right;
        }

        .score-btn {
            background: #1e293b;
            color: var(--text-main);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .score-btn:hover { background: #334155; }
        .score-btn.plus { background: #059669; }
        .score-btn.plus:hover { background: #047857; }

        .delete-btn {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
        }
        .delete-btn:hover { color: #ef4444; }

        .terminal-box {
            width: 100%;
            max-width: 550px;
            margin-top: 25px;
            background: #0d1424;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
        }

        .terminal {
            font-family: monospace;
            font-size: 12px;
            color: #34d399;
            height: 90px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .test-input {
            flex: 1;
            background: #131d31;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .send-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .send-btn:hover { background: #4f46e5; }
    </style>
</head>
<body>

<h1>Point Arena</h1>
<div class="subtitle">micro:bit Serial Scorekeeper</div>

<div class="toolbar">
    <button id="connectBtn" class="btn">🔌 Connect micro:bit</button>
    <button class="btn secondary" onclick="addPlayer()">+ Add Player</button>
</div>

<div class="container" id="playerContainer"></div>

<div class="terminal-box">
    <div class="terminal" id="terminalLog">
        > System ready. Connect your micro:bit or type a command below.
    </div>
    <div class="input-row">
        <input type="text" id="manualCmd" class="test-input" placeholder="Test command (e.g. ADD 18)..." onkeydown="if(event.key==='Enter') submitManual()">
        <button class="send-btn" onclick="submitManual()">Send</button>
    </div>
</div>

<script>
    let players = [
        { name: "Player 1", score: 0 },
        { name: "Player 2", score: 0 }
    ];
    let activeIndex = 0;
    let port, reader;

    const container = document.getElementById('playerContainer');
    const connectBtn = document.getElementById('connectBtn');
    const terminalLog = document.getElementById('terminalLog');

    function log(msg) {
        terminalLog.innerHTML += `<br>> ${msg}`;
        terminalLog.scrollTop = terminalLog.scrollHeight;
    }

    function render() {
        container.innerHTML = '';
        players.forEach((p, idx) => {
            const card = document.createElement('div');
            card.className = `player-card ${idx === activeIndex ? 'active' : ''}`;
            card.onclick = () => setActivePlayer(idx);

            card.innerHTML = `
                <div class="turn-badge">Active Turn</div>
                <div class="player-info" onclick="event.stopPropagation()">
                    <input type="text" class="name-input" value="${p.name}" oninput="players[${idx}].name = this.value">
                </div>
                <div class="score-box" onclick="event.stopPropagation()">
                    <button class="score-btn" onclick="adjustScore(${idx}, -1)">-</button>
                    <div class="score-value">${p.score}</div>
                    <button class="score-btn plus" onclick="adjustScore(${idx}, 1)">+</button>
                    <button class="delete-btn" onclick="removePlayer(${idx})" title="Remove">✕</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function setActivePlayer(idx) {
        activeIndex = idx;
        render();
        log(`Active turn passed to ${players[idx].name}`);
    }

    function nextTurn() {
        if (players.length === 0) return;
        activeIndex = (activeIndex + 1) % players.length;
        render();
        log(`Turn advanced to: ${players[activeIndex].name}`);
    }

    function addPlayer() {
        players.push({ name: `Player ${players.length + 1}`, score: 0 });
        render();
    }

    function removePlayer(idx) {
        players.splice(idx, 1);
        if (activeIndex >= players.length) activeIndex = Math.max(0, players.length - 1);
        render();
    }

    function adjustScore(idx, amount) {
        players[idx].score += amount;
        render();
    }

    connectBtn.addEventListener('click', async () => {
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200 });

            connectBtn.innerText = "Connected (Serial)";
            connectBtn.classList.add('connected');
            log("Connected to micro:bit successfully!");

            const textDecoder = new TextDecoderStream();
            port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();

            readSerialLoop();
        } catch (err) {
            log("Connection error: " + err.message);
        }
    });

    async function readSerialLoop() {
        let buffer = "";
        try {
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += value;
                let lines = buffer.split("\n");
                buffer = lines.pop();

                for (let line of lines) {
                    let cleanLine = line.trim();
                    if (cleanLine) {
                        document.getElementById('manualCmd').value = cleanLine;
                        processMicrobitCommand(cleanLine);
                    }
                }
            }
        } catch (err) {
            log("Read error: " + err.message);
        }
    }

    function submitManual() {
        const inputField = document.getElementById('manualCmd');
        const cmd = inputField.value.trim();
        if (cmd) {
            processMicrobitCommand(cmd);
            inputField.value = "";
        }
    }

    function processMicrobitCommand(cmd) {
        log(`Received: "${cmd}"`);
        if (players.length === 0) return;

        let target = players[activeIndex];
        let upper = cmd.toUpperCase();

        if (upper.includes("MULTIPLY")) {
            let num = parseInt(upper.replace(/[^0-9]/g, '')) || 10;
            target.score *= num;
            log(`${target.name}'s score multiplied by ${num} -> ${target.score}`);
        } else if (upper.includes("DIVIDE")) {
            let num = parseInt(upper.replace(/[^0-9]/g, '')) || 2;
            if (num !== 0) target.score = Math.round(target.score / num);
            log(`${target.name}'s score divided by ${num} -> ${target.score}`);
        } else if (upper.includes("ADD") || upper.includes("+")) {
            let num = parseInt(upper.replace(/[^0-9-]/g, '')) || 10;
            target.score += num;
            log(`Added ${num} to ${target.name} -> ${target.score}`);
        } else if (upper.includes("SUB")) {
            let num = parseInt(upper.replace(/[^0-9]/g, '')) || 10;
            target.score -= num;
            log(`Subtracted ${num} from ${target.name} -> ${target.score}`);
        } else if (upper.includes("RESET")) {
            target.score = 0;
            log(`Reset ${target.name}'s score to 0`);
        } else {
            let num = parseInt(upper.replace(/[^0-9-]/g, '')) || 10;
            target.score += num;
            log(`Default add ${num} to ${target.name} -> ${target.score}`);
        }

        nextTurn();
    }

    render();
</script>

</body>
</html>
